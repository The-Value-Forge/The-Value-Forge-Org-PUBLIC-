<!DOCTYPE html>
<html lang="en-GB">
<head>{{ partial "head.html" . }}</head>
<body class="{{ if .IsHome }}is-home{{ else }}page-{{ .Type | default "page" }}{{ end }}">
  <a href="#main-content" class="skip-link">Skip to main content</a>
  {{ partial "header.html" . }}
  <main id="main-content" tabindex="-1">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ partial "search.html" . }}
</body>
</html>
