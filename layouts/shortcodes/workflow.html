<figure class="workflow" role="img" aria-label="How intelligence reaches publication: weekly evidence scan, weekly synthesis, and monthly pattern review feed a single translation checkpoint, which publishes Signals, Syntheses, and Patterns to the site.">

  <div class="wf-stage wf-sources">
    <div class="wf-card">
      <span class="wf-cadence">Weekly</span>
      <h3 class="wf-name">Evidence scan</h3>
      <p>Published literature, guidance, and grey literature scanned across all five domains. Every item is labelled by evidence type at the point of capture.</p>
    </div>
    <div class="wf-card">
      <span class="wf-cadence">Weekly</span>
      <h3 class="wf-name">Synthesis</h3>
      <p>The week's evidence read across domains through the value-added-time lens. Cross-domain connections are the output, not a by-product.</p>
    </div>
    <div class="wf-card">
      <span class="wf-cadence">Monthly</span>
      <h3 class="wf-name">Pattern review</h3>
      <p>Recurring cross-domain patterns confirmed, updated, or discarded against the month's accumulated evidence. Discards are named, not deleted.</p>
    </div>
  </div>

  <div class="wf-arrow" aria-hidden="true"><span></span></div>

  <div class="wf-stage">
    <div class="wf-card wf-gate">
      <span class="wf-cadence">Every publication</span>
      <h3 class="wf-name">Translation checkpoint</h3>
      <p>The single boundary between analysis and publication. Register changes; meaning never does. Evidence labels, confidence levels, finding statuses, and stated limitations pass through verbatim. Anything that cannot be published honestly is not published at all — a gap is flagged rather than papered over.</p>
    </div>
  </div>

  <div class="wf-arrow" aria-hidden="true"><span></span></div>

  <div class="wf-stage wf-outputs">
    <div class="wf-card">
      <h3 class="wf-name">Signals</h3>
      <p>Individual evidence items with national meaning.</p>
    </div>
    <div class="wf-card">
      <h3 class="wf-name">Syntheses</h3>
      <p>The week's cross-domain analysis, in full.</p>
    </div>
    <div class="wf-card">
      <h3 class="wf-name">Patterns</h3>
      <p>The longitudinal record, statuses intact.</p>
    </div>
  </div>

  <figcaption class="wf-caption">Publication is automated end-to-end; the git history is the audit trail. The Monthly review is produced by the monthly meta-synthesis pipeline and published through the same automated flow.</figcaption>
</figure>
